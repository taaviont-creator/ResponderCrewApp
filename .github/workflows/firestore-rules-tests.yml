name: Firestore rules tests

on:
  pull_request:
    paths:
      - "firestore.rules"
      - "firebase.json"
      - "rules-tests/**"
      - ".github/workflows/firestore-rules-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: rules-tests/package-lock.json

      - name: Install test dependencies
        run: npm install --prefix rules-tests

      - name: Run Firestore rules tests
        run: npm test --prefix rules-tests
