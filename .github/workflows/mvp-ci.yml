name: RespondCrew MVP CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_android_apk:
        description: Build an Android debug APK
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  group: mvp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-check:
    name: Flutter analyze and tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          dart --version

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Set up Gradle for the Android compilation check
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14'

      - name: Compile Android integration without packaging an APK
        run: |
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties
          gradle -p android :sar_alarm_android:testDebugUnitTest :app:compileDebugKotlin --no-daemon

      - name: Build Android debug APK
        if: github.event_name == 'workflow_dispatch' && inputs.build_android_apk
        run: flutter build apk --debug

      - name: Verify packaged SAR alarm sound
        if: github.event_name == 'workflow_dispatch' && inputs.build_android_apk
        run: python3 tool/verify_apk_alarm.py build/app/outputs/flutter-apk/app-debug.apk

      - name: Save Android test APK
        if: github.event_name == 'workflow_dispatch' && inputs.build_android_apk
        uses: actions/upload-artifact@v4
        with:
          name: RespondCrew-Android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  firestore-rules:
    name: Firestore and Storage rules tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firestore test dependencies
        run: npm install --prefix rules-tests

      - name: Install server workflow test dependencies
        run: npm ci --prefix functions

      - name: Run Firestore and Storage emulator tests
        run: npm test --prefix rules-tests

  functions-check:
    name: Firebase Functions check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Check production dependencies for high or critical advisories
        run: npm audit --prefix functions --omit=dev --audit-level=high

      - name: Check Functions JavaScript syntax
        run: node --check functions/index.js

      - name: Run Functions lint script
        run: npm run lint --prefix functions

      - name: Test Functions
        run: node --test functions/*.test.js

  ios-build:
    name: iPhone and iPad build
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify Apple toolchain
        run: |
          swift --version
          xcodebuild -version
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable Flutter Swift Package Manager
        run: flutter config --enable-swift-package-manager
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Build iOS simulator app
        run: flutter build ios --simulator --debug
      - name: Package simulator app
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app build/ios/RespondCrew-simulator.zip
      - name: Save simulator app
        uses: actions/upload-artifact@v4
        with:
          name: RespondCrew-iOS-simulator
          path: build/ios/RespondCrew-simulator.zip
          retention-days: 7
      - name: Save iOS build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-diagnostics
          path: |
            ios/Runner.xcodeproj/project.pbxproj
            ios/Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme
          retention-days: 7
